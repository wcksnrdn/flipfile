[package]
name = "flipfile"
version = "0.9.0"
description = "flipfile: drag-and-drop file converter"
authors = ["wcksnrdn"]
license = "MIT"
repository = "https://github.com/wcksnrdn/flipfile"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flipfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.10"
tauri-plugin-global-shortcut = "2"
trash = "5.2.9"
# Already used by `image`; direct access for lossless Deflate-compressed TIFF output
tiff = "0.11"
arboard = "3"
pdfium-render = "0.9"
typst = "0.15"
typst-pdf = "0.15"
# System fonts only: Typst's embedded fonts would add ~10 MB and every desktop OS ships fonts
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
typst-layout = "0.15"
# Font metrics (Word line heights); already part of the build through Typst
ttf-parser = "0.25"
# Fonts are memory-mapped, not read whole (src/office/typeset.rs); already part of the
# build through Typst's font scanning
memmap2 = "0.9"
# Lossy WEBP (libwebp): the `image` crate only writes lossless WEBP, often larger than JPG
webp = { version = "0.3.1", default-features = false }
# Lossless PNG optimisation ("Lossless" in Photo > Tools > Compress)
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
# JPEG output: the `image` crate's encoder always stores colour at full resolution with
# no way to subsample it; this one encodes 2x faster and, for the size-first qualities,
# writes 4:2:0 like cameras do (~17% smaller). AVX2 is detected at run time.
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# SIMD resizing (NEON, SSE4.1, AVX2): Lanczos3 3-4x faster than `image`'s own resize
fast_image_resize = { version = "6.1.0", features = ["image"] }
# Colour management (embedded ICC profiles -> sRGB, src/convert/input.rs); already part of
# the build through `image`
moxcms = "0.8"
# Speech to text (Transcribe): whisper.cpp with the bundled Whisper model
# (src/platform/whisper.rs); on Apple silicon on the GPU through Metal
whisper-rs = { version = "0.16", default-features = false }
# Decoding the audio of every common file and video container to plain samples for
# transcription (src/convert/transcribe/audio.rs), without ffmpeg
symphonia = { version = "0.6", default-features = false, features = [
  "opt-simd", "aac", "alac", "flac", "mp3", "pcm", "vorbis", "adpcm", "isomp4", "mkv", "ogg", "aiff", "wav", "caf",
] }
# Opus (WhatsApp voice notes, OGG/WebM), which symphonia demuxes but doesn't decode
opus1 = { version = "0.3", default-features = false, features = ["std"] }
# Compress levels for PDFs: re-encodes the pictures inside a PDF and leaves its text and
# layout untouched (src/convert/compress/pdf.rs)
lopdf = { version = "0.47", default-features = false }
# Resampling to the 16 kHz Whisper hears
rubato = { version = "5", default-features = false, features = ["fft_resampler"] }

# Native glass view (src/glass.rs) and HEIC/AVIF decoding via ImageIO (src/system_codec.rs).
# Mostly already compiled as part of Tauri/wry on macOS; these enable a few extra bindings.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Transcription on the GPU of Apple silicon
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSEvent",
  "NSGlassEffectView",
  "NSVisualEffectView",
  # the light/dark Dock icon (src/platform/appearance.rs)
  "NSApplication",
  "NSImage",
] }
objc2-core-foundation = "0.3"
# Decoding into / encoding from plain pixel buffers (src/platform/system_codec.rs), and
# handing them to Vision without a PNG in between; already compiled as part of Tauri.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage",
] }
# Text recognition (Word OCR) and background removal with macOS' built-in Vision framework
objc2-vision = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes",
  "VNGenerateForegroundInstanceMaskRequest", "objc2-core-video", "objc2-core-graphics",
  # faces restored by AI upscaling (src/platform/faces.rs)
  "VNDetectFaceLandmarksRequest", "VNFaceLandmarks", "VNObservation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSRange", "NSData", "NSString", "NSUserDefaults", "NSLocale", "NSIndexSet", "NSArray", "NSDictionary", "NSError", "NSURL", "NSValue"] }
objc2-image-io = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-graphics",
  "CGImageSource",
  "CGImageDestination",
] }
# Reading the background-removal mask (src/platform/background.rs)
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
block2 = "0.6"
# AI upscaling with the bundled model on the Neural Engine (src/platform/upscale.rs)
objc2-core-ml = { version = "0.3", default-features = false, features = [
  "std", "block2", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureProvider", "MLFeatureValue",
  "MLDictionaryFeatureProvider",
] }

# The computer's memory size (src/convert/memory.rs) and peak memory in benchmarks;
# already part of the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# HEIC/AVIF decoding via WIC (src/system_codec.rs) and the Alt key state (src/keys.rs);
# already part of Tauri's dependency tree on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse",
  # Text recognition (Word OCR) with Windows' built-in engine
  "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams",
  # The region's decimal and thousands separators (Excel -> PDF)
  "Win32_Globalization",
  # The computer's memory size (src/convert/memory.rs)
  "Win32_System_SystemInformation",
  # Video -> MP4 with Windows' built-in Media Foundation engine (src/convert/media.rs)
  "Media_MediaProperties", "Media_Transcoding", "Storage", "Storage_Search",
  # Loading the bundled DirectML for AI upscaling (src/platform/onnx.rs)
  "Win32_System_LibraryLoader",
] }
# AI upscaling on the GPU (src/platform/onnx.rs)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

# AI upscaling on Windows and Linux: ONNX Runtime (src/platform/onnx.rs), loaded at run time
# from the bundled library (scripts/fetch-onnxruntime.mjs) instead of linked or downloaded
# by the crate
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }


# `tauri dev` builds without optimisation. The image encoders (AVIF/rav1e, GIF palette
# quantisation, PNG, PDFium bindings) then run 10-100x slower: one AVIF conversion of
# a 12 MP photo took over 15 minutes. Optimising the dependencies (not flipfile itself,
# which stays quick to rebuild and debug) makes dev behave like the release app.
[dev-dependencies]
# Builds sample Word files for the tests
docx-rs = "0.4"
# Builds Ogg Opus files (WhatsApp voice notes) for the transcription tests
ogg = "0.9"

# The Windows/Linux AI upscaling engine, tested on a Mac too (FLIPFILE_ONNX=1 npm run fetch-onnxruntime)
[target.'cfg(target_os = "macos")'.dev-dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[profile.dev.package."*"]
opt-level = 3

# `npm run bench` (src/convert/bench.rs): optimised like a release build, without the
# long single-unit LTO link, and with line tables so profilers can name hot functions.
[profile.bench]
lto = false
codegen-units = 16
debug = "line-tables-only"
strip = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Not "abort": flipfile opens whatever files people drop through dozens of third-party
# decoders, and a panic on one odd file must fail that file (src/convert/mod.rs,
# `isolate`), not close the app. Costs 5.5 MB of binary.
panic = "unwind"
strip = true
