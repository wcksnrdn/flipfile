name: CI

# Lint, test, typecheck + build the UI, then lint and test the Rust side on every push and pull request,
# so a broken main is caught before a release tag is pushed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The tests use macOS-only engines (ImageIO for HEIC/AVIF, Vision for OCR)
    # Skip by adding [skip ci] or #skipscan to the commit message.
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '#skipscan')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Lint UI
        run: npm run lint

      - name: UI unit tests
        run: npm run test:web

      - name: Typecheck and build UI
        run: npm run build

      - name: Fetch PDFium
        run: npm run fetch-pdfium

      # The ONNX engine and models too: the Windows/Linux upscaling engine is tested here
      - name: Fetch AI models
        env:
          FLIPFILE_ONNX: "1"
        run: npm run fetch-models && npm run fetch-onnxruntime

      - name: Rust lint
        working-directory: src-tauri
        env:
          FLIPFILE_REQUIRE_AI: "1"
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          # The Apple Intelligence helper must compile with the runner's Xcode
          FLIPFILE_REQUIRE_AI: "1"
        run: cargo test
