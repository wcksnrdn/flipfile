name: Release

# Push a tag like `v0.1.0` to build installers for macOS, Windows and Linux
# and attach them to a draft GitHub Release. Can also be started manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # beforeBuildCommand runs fetch-pdfium; pin the platform so the Intel macOS
      # build (made on an Apple Silicon runner) bundles the x64 library.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "flipfile v__VERSION__"
          releaseBody: "Download the installer for your OS from the assets below."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
