name: Release

# Push a tag like `v0.1.0` to build installers for macOS, Windows and Linux
# and attach them to a draft GitHub Release. Can also be started manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # signed build provenance for every installer (actions/attest-build-provenance)
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # beforeBuildCommand runs fetch-pdfium; pin the platform so the Intel macOS
      # build (made on an Apple Silicon runner) bundles the x64 library.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
          # macOS: fail rather than ship without the Apple Intelligence helper
          FLIPFILE_REQUIRE_AI: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "flipfile v__VERSION__"
          releaseBody: "Download the installer for your OS from the assets below."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Proves each installer was built here, from this commit of the public repo.
      # Anyone can check a download with:
      #   gh attestation verify <file> --repo wcksnrdn/flipfile
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  # One SHA256SUMS.txt for the whole release, so a download can be checked with
  # `shasum -a 256 -c SHA256SUMS.txt --ignore-missing` (or `certutil -hashfile` on Windows).
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir assets && cd assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee ../SHA256SUMS.txt
          gh release upload "$tag" ../SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
