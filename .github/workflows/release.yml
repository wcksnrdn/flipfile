name: Release

# Push a tag like `v0.1.0` to build installers for macOS, Windows and Linux
# and attach them to a draft GitHub Release. Can also be started manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The release that comes with every AI model, for the apps from before packs: their updater
# reads latest.json, and this build keeps their models when the next one, without them,
# replaces it (src-tauri/full/README.md). Every later release gives them this one's
# latest.json; apps from it on read update.json.
env:
  BRIDGE: v0.14.0

permissions:
  contents: write
  # signed build provenance for every installer (actions/attest-build-provenance)
  id-token: write
  attestations: write

jobs:
  # The apps download their AI models from the packs release: it must have every file of
  # the catalog they are built with
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every pack file is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/packs.mjs published

  build:
    needs: packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
            models: coreml
          - platform: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
            models: coreml
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
            models: onnx
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
            models: onnx

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # The bridge release bundles every model (FLIPFILE_FULL: fetch-models fetches them)
      - name: Bundle the models? (bridge release)
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" = "$BRIDGE" ]; then
            echo "FLIPFILE_FULL=1" >> "$GITHUB_ENV"
            echo "FULL_CONFIG=--config src-tauri/full/${{ matrix.models }}.json" >> "$GITHUB_ENV"
          fi

      # beforeBuildCommand runs fetch-pdfium; pin the platform so the Intel macOS
      # build (made on an Apple Silicon runner) bundles the x64 library.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
          # macOS: fail rather than ship without the Apple Intelligence helper
          FLIPFILE_REQUIRE_AI: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "flipfile v__VERSION__"
          releaseBody: "Download the installer for your OS from the assets below."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ env.FULL_CONFIG }}

      # Without this entitlement the hardened runtime refuses the bundled PDFium, and
      # every PDF conversion fails with "the PDF engine is missing"
      - name: Check the PDF engine can be loaded (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(echo src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          codesign -d --entitlements - --xml "$app" | grep -q disable-library-validation
          test -f "$app/Contents/Resources/pdfium/libpdfium.dylib"

      # Proves each installer was built here, from this commit of the public repo.
      # Anyone can check a download with:
      #   gh attestation verify <file> --repo wcksnrdn/flipfile
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  # One SHA256SUMS.txt for the whole release, so a download can be checked with
  # `shasum -a 256 -c SHA256SUMS.txt --ignore-missing` (or `certutil -hashfile` on Windows).
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri-action writes latest.json; apps since packs read update.json, and the older
      # ones keep getting the bridge release (see BRIDGE above)
      - name: Updater feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir feeds && cd feeds
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          mv latest.json update.json
          gh release upload "$tag" update.json --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$tag" != "$BRIDGE" ]; then
            gh release download "$BRIDGE" --repo "$GITHUB_REPOSITORY" --pattern latest.json
            gh release upload "$tag" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir assets && cd assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee ../SHA256SUMS.txt
          gh release upload "$tag" ../SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
